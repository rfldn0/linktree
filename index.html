<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>@rfldno</title>
    <meta name="description" content="Victor Tabuni — Project Manager · Builder · Software Development">
    <meta name="theme-color" content="#efe9df">
    <link rel="icon" href="assets/avatar.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arrow icons as SVG so phones never swap them for emoji -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-diag" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>
    <main class="page">
        <div class="stack">
            <div class="card">

                <header class="banner">
                    <div class="speed-lines" aria-hidden="true"></div>
                    <div class="logo">
                        <img src="assets/cipher-studio-banner.png" alt="Cipher Studio">
                    </div>
                    <div class="banner-text">
                        <span class="eyebrow">BUILDER</span>
                        <h1>@rfldno</h1>
                    </div>
                </header>

                <div class="body">
                    <div class="avatar-row">
                        <picture class="avatar">
                            <source srcset="assets/avatar.webp" type="image/webp">
                            <img src="assets/avatar.png" alt="Victor Tabuni" width="104" height="104">
                        </picture>
                    </div>
                    <p class="bio">Project Manager · Builder · Software Development</p>

                    <nav class="index" aria-label="Main links">
                        <a href="https://myportfolio-vtabuni.vercel.app/" target="_blank" rel="noopener noreferrer" class="row">
                            <span class="num">01</span>
                            <span class="row-text">
                                <span class="row-title row-title--lead">My Site</span>
                                <span class="muted">Portfolio · vercel.app</span>
                            </span>
                            <span class="arrow"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-right"/></svg></span>
                        </a>
                        <a href="https://rfldn0.github.io/projects-hub/" target="_blank" rel="noopener noreferrer" class="row">
                            <span class="num">02</span>
                            <span class="row-text">
                                <span class="row-title">Projects Hub</span>
                                <span class="muted">everything I've built · github.io</span>
                            </span>
                            <span class="arrow arrow--small"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-diag"/></svg></span>
                        </a>
                    </nav>

                    <section class="connect" aria-labelledby="connect-h">
                        <h2 id="connect-h">CONNECT</h2>
                        <div class="socials">
                            <a href="https://github.com/rfldn0" target="_blank" rel="noopener noreferrer">GitHub <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-diag"/></svg></a>
                            <a href="https://www.linkedin.com/in/victor-rifaldino-tabuni-14856628b/" target="_blank" rel="noopener noreferrer">LinkedIn <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#i-diag"/></svg></a>
                        </div>
                    </section>
                </div>
            </div>

            <footer>© 2026 rfldno</footer>
        </div>
    </main>
</body>
</html>
